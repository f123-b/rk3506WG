<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK3506 环境监测站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0a0e17;color:#e2e8f0;min-height:100vh;padding:16px}
  .header{text-align:center;padding:20px 0;border-bottom:2px solid #1e293b;margin-bottom:20px}
  .header h1{font-size:1.4rem;color:#3b82f6}
  .header p{font-size:0.8rem;color:#64748b;margin-top:4px}
  .refresh-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .refresh-bar span{font-size:0.75rem;color:#475569}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .dot.ok{background:#10b981;box-shadow:0 0 6px #10b981}
  .dot.err{background:#ef4444;box-shadow:0 0 6px #ef4444}
  .dot.warn{background:#f59e0b;box-shadow:0 0 6px #f59e0b}

  /* 传感器卡片 */
  .sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .sensor-card{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155;text-align:center}
  .sensor-card h3{font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.5px}
  .sensor-card .value{font-size:1.8rem;font-weight:700;margin:6px 0}
  .sensor-card .unit{font-size:0.8rem;color:#94a3b8}
  .temp .value{color:#f59e0b}
  .humi .value{color:#06b6d4}
  .valid .value{font-size:1rem;color:#10b981}

  /* 子系统状态 */
  .subsys-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
  .subsys{background:#1e293b;border-radius:10px;padding:14px;border:1px solid #334155}
  .subsys .title{font-size:0.8rem;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .subsys table{width:100%;border-collapse:collapse}
  .subsys td{padding:3px 0;font-size:0.78rem}
  .subsys td:first-child{color:#64748b;width:70px}
  .subsys td:last-child{color:#cbd5e1;text-align:right}
  .mqtt .title{color:#3b82f6}
  .modbus .title{color:#f59e0b}
  .can .title{color:#10b981}
  .ota .title{color:#8b5cf6}

  /* OTA 进度条 */
  .progress-bar{background:#0f172a;border-radius:4px;height:6px;margin-top:6px;overflow:hidden}
  .progress-fill{background:#8b5cf6;height:100%;border-radius:4px;transition:width 0.3s}

  /* 底部信息 */
  .footer{margin-top:16px;text-align:center;font-size:0.7rem;color:#475569}
  .footer a{color:#64748b}
</style>
</head>
<body>

<div class="header">
  <h1>🌡️ RK3506 环境监测站</h1>
  <p>MQTT · Modbus · CAN · OTA 综合仪表盘</p>
</div>

<div class="refresh-bar">
  <span id="net-status"><span class="dot ok"></span>在线</span>
  <span id="clock">--</span>
</div>

<!-- 传感器数据 -->
<div class="sensor-grid">
  <div class="sensor-card temp">
    <h3>🌡️ 温度</h3>
    <div class="value" id="temp">--.-</div>
    <div class="unit">℃</div>
  </div>
  <div class="sensor-card humi">
    <h3>💧 湿度</h3>
    <div class="value" id="humi">--</div>
    <div class="unit">%</div>
  </div>
  <div class="sensor-card valid">
    <h3>📡 状态</h3>
    <div class="value" id="valid">等待</div>
  </div>
</div>

<!-- 子系统状态 -->
<div class="subsys-grid">
  <div class="subsys mqtt">
    <div class="title">🔗 MQTT</div>
    <table>
      <tr><td>Broker</td><td id="mqtt-broker">--</td></tr>
      <tr><td>状态</td><td id="mqtt-state">--</td></tr>
      <tr><td>重连次数</td><td id="mqtt-retries">0</td></tr>
      <tr><td>Topic</td><td id="mqtt-topic">--</td></tr>
    </table>
  </div>
  <div class="subsys modbus">
    <div class="title">🔌 Modbus/RS485</div>
    <table>
      <tr><td>状态</td><td id="modbus-state">--</td></tr>
      <tr><td>数据点</td><td id="modbus-pts">0</td></tr>
      <tr><td>TX 发送</td><td id="modbus-tx">0</td></tr>
    </table>
  </div>
  <div class="subsys can">
    <div class="title">🚗 CAN Bus</div>
    <table>
      <tr><td>状态</td><td id="can-state">--</td></tr>
      <tr><td>TX 发送</td><td id="can-tx">0</td></tr>
      <tr><td>RX 接收</td><td id="can-rx">0</td></tr>
      <tr><td>数据点</td><td id="can-pts">0</td></tr>
    </table>
  </div>
  <div class="subsys ota">
    <div class="title">🔄 OTA 升级 <span style="font-size:0.65rem;font-weight:400" id="ota-delta-badge"></span></div>
    <table>
      <tr><td>状态</td><td id="ota-state">idle</td></tr>
      <tr><td>版本</td><td id="ota-ver">--</td></tr>
      <tr><td>服务器</td><td id="ota-server" style="font-size:0.65rem;word-break:break-all">--</td></tr>
    </table>
    <div class="progress-bar"><div class="progress-fill" id="ota-bar" style="width:0%"></div></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="otaCheck()" id="btn-ota-check" style="flex:1;padding:8px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:0.78rem;cursor:pointer">🔍 检测更新</button>
      <button onclick="otaInstall()" id="btn-ota-install" style="flex:1;padding:8px;border:none;border-radius:6px;background:#10b981;color:#fff;font-size:0.78rem;cursor:pointer">⬇️ 下载安装</button>
    </div>
  </div>
</div>

<div class="footer">
  RK3506 IoT EVM &nbsp;|&nbsp; <span id="sys-ver">v3.0.0</span> &nbsp;|&nbsp; 刷新: 1s
</div>

<script>
const STATUS_API = '/api/status';
const SENSOR_API = '/api/sensor/current';
let failCount = 0;

function setDot(el, ok) {
  if (ok) el.innerHTML = '<span class="dot ok"></span>在线';
  else el.innerHTML = '<span class="dot err"></span>离线';
}

async function fetchStatus() {
  try {
    const res = await fetch(STATUS_API);
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();

    /* MQTT */
    document.getElementById('mqtt-broker').textContent = s.mqtt?.broker || '--';
    const mqttOk = s.mqtt?.connected;
    document.getElementById('mqtt-state').innerHTML = mqttOk
      ? '<span style="color:#10b981">● 已连接</span>'
      : '<span style="color:#ef4444">● 断开</span>';
    document.getElementById('mqtt-retries').textContent = s.mqtt?.retries || 0;
    document.getElementById('mqtt-topic').textContent = s.mqtt?.topic || '--';

    /* Modbus */
    document.getElementById('modbus-state').innerHTML = s.modbus?.active
      ? '<span style="color:#10b981">● 活跃</span>'
      : '<span style="color:#64748b">○ 空闲</span>';
    document.getElementById('modbus-pts').textContent = s.modbus?.data_points || 0;
    document.getElementById('modbus-tx').textContent = s.modbus?.tx_count || 0;

    /* CAN */
    document.getElementById('can-state').innerHTML = s.can?.active
      ? '<span style="color:#10b981">● 活跃</span>'
      : '<span style="color:#64748b">○ 空闲</span>';
    document.getElementById('can-tx').textContent = s.can?.tx_count || 0;
    document.getElementById('can-rx').textContent = s.can?.rx_count || 0;
    document.getElementById('can-pts').textContent = s.can?.data_points || 0;

    /* OTA */
    const otaStatus = s.ota?.status || 'idle';
    let otaColor = '#64748b';
    if (otaStatus === 'success') otaColor = '#10b981';
    else if (otaStatus === 'failed') otaColor = '#ef4444';
    else if (otaStatus === 'downloading' || otaStatus === 'checking') otaColor = '#f59e0b';
    document.getElementById('ota-state').innerHTML = `<span style="color:${otaColor}">● ${otaStatus}</span>`;
    document.getElementById('ota-ver').textContent = s.ota?.version || '--';
    document.getElementById('ota-server').textContent = s.ota?.server || '--';
    document.getElementById('ota-bar').style.width = (s.ota?.progress || 0) + '%';
    document.getElementById('sys-ver').textContent = 'v' + (s.system?.version || '--');

    /* 综合在线状态 */
    setDot(document.getElementById('net-status'), true);
    failCount = 0;
  } catch(e) {
    failCount++;
    if (failCount > 3) setDot(document.getElementById('net-status'), false);
  }
}

async function fetchSensor() {
  try {
    const res = await fetch(SENSOR_API);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    document.getElementById('temp').textContent = d.temperature?.toFixed(1) || '--.-';
    document.getElementById('humi').textContent = d.humidity?.toFixed(0) || '--';
    document.getElementById('valid').textContent = d.valid ? '✅ 有效' : '⚠️ 无效';
    document.getElementById('valid').style.color = d.valid ? '#10b981' : '#f59e0b';
  } catch(e) { /* ignore sensor errors if status is fine */ }
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('zh-CN');
}

async function otaCheck() {
  const btn = document.getElementById('btn-ota-check');
  btn.textContent = '⏳ 检测中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/ota/check');
    const data = await res.json();
    if (data.update_available) {
      let msg = `<span style="color:#10b981">● 新版本: ${data.version}</span>`;
      if (data.has_delta) msg += ' <span style="font-size:0.65rem;color:#8b5cf6">[增量]</span>';
      document.getElementById('ota-state').innerHTML = msg;
      document.getElementById('ota-ver').textContent = data.version;
      if (data.has_delta) {
        document.getElementById('ota-delta-badge').textContent = '⚡增量可用';
      } else {
        document.getElementById('ota-delta-badge').textContent = '';
      }
      btn.textContent = '✅ 发现新版本!';
    } else {
      document.getElementById('ota-state').innerHTML = `<span style="color:#f59e0b">● 已是最新</span>`;
      document.getElementById('ota-delta-badge').textContent = '';
      btn.textContent = '🔍 检测更新';
    }
  } catch(e) {
    document.getElementById('ota-state').innerHTML = '<span style="color:#ef4444">● 检测失败</span>';
    btn.textContent = '🔍 重试';
  }
  btn.disabled = false;
}

async function otaInstall() {
  const btn = document.getElementById('btn-ota-install');
  if (!confirm('将下载并安装新固件, 安装期间设备会重启。确定继续?')) return;
  btn.textContent = '⏳ 下载中...';
  btn.disabled = true;
  document.getElementById('btn-ota-check').disabled = true;
  try {
    const res = await fetch('/api/ota/start', {method:'POST'});
    const data = await res.json();
    if (data.success) {
      document.getElementById('ota-state').innerHTML = '<span style="color:#f59e0b">● 下载安装中...</span>';
      btn.textContent = '⏳ 安装中...';
    } else {
      document.getElementById('ota-state').innerHTML = `<span style="color:#ef4444">● ${data.error||'失败'}</span>`;
      btn.textContent = '⬇️ 重试';
      btn.disabled = false;
      document.getElementById('btn-ota-check').disabled = false;
    }
  } catch(e) {
    /* 安装过程中设备会重启, 连接断开是正常的 */
    document.getElementById('ota-state').innerHTML = '<span style="color:#10b981">● 设备重启中...</span>';
    btn.textContent = '✅ 已发送';
  }
}

fetchStatus(); fetchSensor(); updateClock();
setInterval(fetchStatus, 1000);
setInterval(fetchSensor, 1000);
setInterval(updateClock, 1000);
</script>
</body>
</html>
