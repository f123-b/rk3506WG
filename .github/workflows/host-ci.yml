name: Host Simulation CI

on:
  push:
    branches:
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  host-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev

      - name: Configure host simulation
        run: cmake -S . -B build_ci -DHOST_SIMULATION=ON

      - name: Build host simulation
        run: cmake --build build_ci --parallel 2
